version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PREDICTION_API_URL=${PREDICTION_API_URL:-http://host.docker.internal:8000}
      - PREDICTION_CONFIDENCE_THRESHOLD=0.60
      - DATABASE_URL=sqlite:///./agrirakshak.db
      - JWT_SECRET=agrirakshak_super_secret_jwt_key_sih_2026
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend
